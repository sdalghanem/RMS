{% load static %}
<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8">
    <title>استعادة كلمة المرور</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f8fafc;
        }

        .auth-wrapper {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .auth-card {
            border-radius: 16px;
            border: 1px solid #e9eef5;
            box-shadow: 0 8px 26px rgba(16, 24, 40, .06);
        }

        .brand-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: .35rem;
            margin-bottom: 1rem;
        }

        .brand-badge img {
            height: 56px;
            width: auto;
            object-fit: contain;
        }

        .brand-title {
            font-weight: 700;
            color: #0f172a;
            font-size: 1.05rem;
        }

        .form-label {
            font-weight: 600;
            color: #334155;
        }

        .muted {
            color: #6b7280;
            font-size: .88rem;
        }
    </style>
</head>

<body>

<div class="auth-wrapper">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-sm-10 col-md-7 col-lg-5 col-xl-4">

                <div class="card auth-card">

                    <div class="card-body p-4 p-md-5">

                        <div class="brand-badge text-center">

                            <img
                                src="{% static 'Management/images/logo.svg' %}"
                                alt=""
                                onerror="this.style.display='none'"
                            >

                            <div class="brand-title">
                                استعادة كلمة المرور
                            </div>

                        </div>

                        <p class="text-muted text-center mb-4">
                            أدخل بريدك الإلكتروني وسنرسل لك رابطًا
                            لتعيين كلمة مرور جديدة.
                        </p>

                        <form method="post">

                            {% csrf_token %}

                            <div class="mb-3">

                                <label
                                    class="form-label"
                                    for="{{ form.email.id_for_label }}"
                                >
                                    البريد الإلكتروني
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="bi bi-envelope"></i>
                                    </span>

                                    {{ form.email }}

                                </div>

                                {% if form.email.errors %}

                                    <div class="text-danger small mt-1">
                                        {{ form.email.errors|striptags }}
                                    </div>

                                {% endif %}

                            </div>

                            <div class="d-grid">

                                <button
                                    type="submit"
                                    class="btn btn-primary"
                                >
                                    <i class="bi bi-envelope me-1"></i>
                                    إرسال رابط الاستعادة
                                </button>

                            </div>

                        </form>

                        <div class="text-center mt-3">

                            <a
                                href="{% url 'Management:login' %}"
                                class="text-decoration-none"
                            >
                                العودة لتسجيل الدخول
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
