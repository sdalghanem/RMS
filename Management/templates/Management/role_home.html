{% load static %}
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>{{ title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
</head>
<body class="p-4">
<div class="container">
  {% if messages %}
    {% for m in messages %}
      <div class="alert alert-{{ m.tags }} mb-3">{{ m }}</div>
    {% endfor %}
  {% endif %}

  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h4 class="mb-2">{{ heading }}</h4>
      <p class="text-muted mb-4">{{ desc }}</p>
      <a href="{% url 'Management:logout' %}" class="btn btn-outline-secondary">تسجيل الخروج</a>
    </div>
  </div>
</div>
</body>
</html>
