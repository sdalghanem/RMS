{% extends "Management/base.html" %}
{% block title %}{{ title }} - RMS{% endblock %}

{% block content %}
<div class="rms-pagebar d-flex justify-content-between align-items-center p-3 mb-3 rounded-3">
  <h5 class="m-0">{{ title }}</h5>
  <a class="btn btn-outline-secondary" href="{% url 'Management:payment_plan_list' %}">رجوع للقائمة</a>
</div>

<div class="card shadow-sm border-0">
  <div class="card-body">
    <form method="post" novalidate>
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">{{ form.amount.label }}</label>
          {{ form.amount }}
        </div>
        <div class="col-md-4">
          <label class="form-label">{{ form.duration_months.label }}</label>
          {{ form.duration_months }}
        </div>
        <div class="col-md-4 d-flex align-items-center">
          <div class="form-check mt-4">
            {{ form.is_active }}
            <label class="form-check-label" for="{{ form.is_active.id_for_label }}">{{ form.is_active.label }}</label>
          </div>
        </div>
      </div>

      <div class="mt-4 d-flex gap-2">
        <button class="btn btn-primary" type="submit">حفظ</button>
        <a class="btn btn-light" href="{% url 'Management:payment_plan_list' %}">إلغاء</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
